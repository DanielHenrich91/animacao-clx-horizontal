<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo em Tela Cheia - Estudo</title>
    
    <!-- Link para importar o módulo CSS (Estilos) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      Tag <video>: Renderiza vídeos na página.
      - id="meuVideo": Identificador único para usarmos no JavaScript.
      - controls: Ativa os botões nativos de play, pause, volume e tela cheia.
      - loop: Faz o vídeo reiniciar automaticamente quando chega ao fim.
      - src="CLX_2.mp4": Caminho do seu arquivo de vídeo.
    -->
    <video id="meuVideo" src="arquivo/CLX MOTION - H 4K.mp4" controls loop></video>

    <!-- Script para importar o módulo JavaScript (Lógica/Interação) -->
    <!-- Geralmente colocado no final do <body> para carregar a página mais rápido -->
    <script src="script.js"></script>
</body>
</html>
